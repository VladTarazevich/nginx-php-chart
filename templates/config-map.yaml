---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-configmap
data:
  default.conf: |
    upstream color_servers {
      server 127.0.0.1:8081;
      server 127.0.0.1:8082;
    }
    server {
    listen 80;
    server_name localhost;
    access_log /dev/stdout;
    error_log /dev/stderr;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /content1 {
        proxy_pass http://127.0.0.1:8080;
    }
    location /music/ {
        alias /usr/share/nginx/music/;
        default_type application/octet-stream;
    }
      location /info.php {
        proxy_pass http://apache-service:80;
      }
      location /secondserver/ {
      proxy_pass https://habr.com/;
      proxy_set_header Host habr.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
      sub_filter '="/' '="/secondserver/';
      sub_filter_once off;
      proxy_set_header Accept-Encoding "";
      }
      location /redblue {
        proxy_pass http://color_servers;
      }
      location ~* \.jpg$ {
        root /usr/share/nginx/images;
        image_filter rotate 180;
        image_filter_buffer 10M;
      }
      location ~* \.png$ {
        root /usr/share/nginx/images;
      }
      location /cpu {
        alias /usr/share/nginx/html/cpu.html;
        default_type text/html;
        add_header Refresh "5";
      }
    }
    server {
      listen 8080;
      location / { default_type text/plain; return 200 "Content 1 (Port 8080)\n"; }
    }
    server {
      listen 8081;
      location / { default_type text/html; return 200 "<body style='background:yellow;color:white;'><h1>RED</h1></body>"; }
    }
    server {
      listen 8082;
      location / { default_type text/html; return 200 "<body style='background:blue;color:white;'><h1>BLUE</h1></body>"; }
    }
  nginx.conf: |-
    load_module modules/ngx_http_image_filter_module.so;
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;
    events {
    worker_connections  1024;
    }
    http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'upstream_addr: $upstream_addr';
    access_log  /var/log/nginx/access.log;
    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
    }
