---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: nginxapp
spec:
  selector:
    matchLabels:
      app: nginxapp
  replicas: 2
  template:
    metadata:
      labels:
        app: nginxapp
    spec:
      volumes:
        - name: nginx-logs-shared
          emptyDir: {}
        - name: nginx-html
          emptyDir: {}
        - name: nginx-config-volume
          configMap:
            name: {{ .Release.Name }}-nginx-configmap
      initContainers:
        - name: init-html
          image: busybox
          command: [sh, -c, echo "" > /data/cpu.html]
          volumeMounts:
            - name: nginx-html
              mountPath: /data
      containers:
        - name: nginxapp
          image: vladnemocr/nginxapp:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-logs-shared
              mountPath: /var/log/nginx
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-html
              mountPath: /usr/share/nginx/html/cpu.html
              subPath: cpu.html
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 15
        - name: log-parser
          image: vladnemocr/log_parser:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: nginx-logs-shared
              mountPath: /var/log/nginx
            - name: nginx-html
              mountPath: /usr/share/nginx/html
