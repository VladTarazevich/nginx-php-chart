---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apacheapp-deployment
  labels:
    app: apacheapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apacheapp
  template:
    metadata:
      labels:
        app: apacheapp
    spec:
      containers:
        - name: apache-service
          image: vladnemocr/apacheversion:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
